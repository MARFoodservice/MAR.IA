document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

    --mar-orange-soft: #f59a4d;\n    --ink: #061325;\n    --ink-soft: rgba(255,255,255,0.72);\n    --ink-mute: rgba(255,255,255,0.48);\n    --line: rgba(255,255,255,0.14);\n    --line-strong: rgba(255,255,255,0.28);\n    --card: rgba(8,22,42,0.42);\n    --card-hover: rgba(8,22,42,0.58);\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { background: var(--ink); color: #fff; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  html { scroll-behavior: smooth; scroll-padding-top: 80px; }\n  body { min-height: 100vh; overflow-x: hidden; }\n\n  /* Shader canvas — fixed fullscreen, behind everything */\n  #shader {\n    position: fixed; inset: 0; width: 100%; height: 100%;\n    z-index: 0; display: block;\n  }\n  /* Subtle grain overlay */\n  .grain {\n    position: fixed; inset: 0; z-index: 1; pointer-events: none;\n    opacity: 0.07; mix-blend-mode: overlay;\n    background-image: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\u002Ffilter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/><\u002Fsvg>\");\n  }\n  /* Vignette to deepen edges */\n  .vignette {\n    position: fixed; inset: 0; z-index: 1; pointer-events: none;\n    background:\n      radial-gradient(120% 80% at 50% 50%, transparent 55%, rgba(2,8,18,0.55) 100%),\n      linear-gradient(180deg, rgba(2,8,18,0.3) 0%, transparent 25%, transparent 70%, rgba(2,8,18,0.5) 100%);\n  }\n\n  main { position: relative; z-index: 2; padding: 32px clamp(20px, 4vw, 56px) 96px; }\n\n  /* Top bar */\n  .topbar {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 4px 0 0;\n  }\n  .brand {\n    display: flex; align-items: center; gap: 14px;\n  }\n  .brand-mark {\n    width: 42px; height: 42px; border-radius: 12px;\n    background: rgba(255,255,255,0.92);\n    display: grid; place-items: center;\n    box-shadow: 0 6px 20px rgba(14,95,171,0.35), inset 0 0 0 1px rgba(255,255,255,0.6);\n    overflow: hidden;\n  }\n  .brand-mark img { width: 32px; height: auto; display: block; }\n  .brand-text { line-height: 1.05; }\n  .brand-name { font-weight: 700; letter-spacing: -0.01em; font-size: 15px; }\n  .brand-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-mute); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 3px; }\n\n  .topnav {\n    display: flex; align-items: center; gap: 6px;\n    padding: 6px;\n    background: rgba(8,22,42,0.42);\n    border: 1px solid var(--line);\n    border-radius: 999px;\n    backdrop-filter: blur(14px);\n    -webkit-backdrop-filter: blur(14px);\n  }\n  .topnav a {\n    color: var(--ink-soft);\n    text-decoration: none;\n    font-size: 13px; font-weight: 500;\n    padding: 8px 14px; border-radius: 999px;\n    transition: all 0.2s ease;\n  }\n  .topnav a:hover { color: #fff; background: rgba(255,255,255,0.06); }\n  .topnav a.active { color: #fff; background: rgba(238,123,34,0.18); box-shadow: inset 0 0 0 1px rgba(238,123,34,0.4); }\n\n  .status {\n    display: flex; align-items: center; gap: 8px;\n    font-family: 'JetBrains Mono', monospace; font-size: 11px;\n    color: var(--ink-mute); letter-spacing: 0.04em;\n  }\n  .dot {\n    width: 7px; height: 7px; border-radius: 50%;\n    background: #4ade80; box-shadow: 0 0 12px #4ade80;\n    animation: pulse 1.6s ease-in-out infinite;\n  }\n  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }\n\n  /* Hero */\n  .hero {\n    margin-top: clamp(56px, 11vw, 130px);\n    max-width: 1100px;\n  }\n  .eyebrow {\n    display: inline-flex; align-items: center; gap: 10px;\n    font-family: 'JetBrains Mono', monospace; font-size: 11px;\n    letter-spacing: 0.18em; text-transform: uppercase;\n    color: var(--mar-orange-soft);\n    padding: 7px 14px; border-radius: 999px;\n    background: rgba(238,123,34,0.10);\n    border: 1px solid rgba(238,123,34,0.32);\n  }\n  .eyebrow::before {\n    content: ''; width: 6px; height: 6px; border-radius: 50%;\n    background: var(--mar-orange); box-shadow: 0 0 10px var(--mar-orange);\n  }\n\n  h1 {\n    font-size: clamp(48px, 8.5vw, 124px);\n    font-weight: 700;\n    letter-spacing: -0.04em;\n    line-height: 0.96;\n    margin-top: 22px;\n    text-wrap: balance;\n  }\n  h1 .accent {\n    font-style: italic;\n    font-weight: 400;\n    background: linear-gradient(96deg, var(--mar-orange) 0%, var(--mar-orange-soft) 60%, #ffd6a8 100%);\n    -webkit-background-clip: text; background-clip: text;\n    -webkit-text-fill-color: transparent;\n  }\n  h1 .smile {\n    display: inline-block; vertical-align: middle;\n    width: clamp(60px, 10vw, 140px); height: auto;\n    margin: 0 0.05em -0.18em -0.05em;\n    filter: drop-shadow(0 8px 24px rgba(238,123,34,0.4));\n  }\n\n  .lede {\n    margin-top: 28px;\n    max-width: 640px;\n    font-size: clamp(15px, 1.3vw, 18px);\n    line-height: 1.55;\n    color: var(--ink-soft);\n    text-wrap: pretty;\n  }\n\n  .cta-row {\n    display: flex; gap: 12px; flex-wrap: wrap;\n    margin-top: 36px;\n  }\n  .btn {\n    display: inline-flex; align-items: center; gap: 10px;\n    padding: 14px 22px; border-radius: 999px;\n    font-size: 14px; font-weight: 600;\n    text-decoration: none;\n    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;\n    cursor: pointer; border: 0;\n    font-family: inherit;\n  }\n  .btn-primary {\n    background: var(--mar-orange); color: #1a0a00;\n    box-shadow: 0 10px 30px -8px rgba(238,123,34,0.7), inset 0 1px 0 rgba(255,255,255,0.3);\n  }\n  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 18px 40px -8px rgba(238,123,34,0.9), inset 0 1px 0 rgba(255,255,255,0.3); }\n  .btn-ghost {\n    background: rgba(255,255,255,0.06); color: #fff;\n    border: 1px solid var(--line-strong);\n    backdrop-filter: blur(10px);\n  }\n  .btn-ghost:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }\n  .btn svg { width: 16px; height: 16px; }\n\n  /* Stats strip */\n  .stats {\n    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;\n    margin-top: clamp(64px, 9vw, 120px);\n    background: var(--line);\n    border: 1px solid var(--line);\n    border-radius: 18px;\n    overflow: hidden;\n    backdrop-filter: blur(16px);\n    -webkit-backdrop-filter: blur(16px);\n  }\n  .stat {\n    background: rgba(8,22,42,0.55);\n    padding: 22px 24px;\n  }\n  .stat-num {\n    font-size: clamp(28px, 3.2vw, 40px);\n    font-weight: 700; letter-spacing: -0.03em;\n    line-height: 1;\n  }\n  .stat-num .unit { color: var(--mar-orange); font-weight: 500; }\n  .stat-label {\n    margin-top: 8px;\n    font-family: 'JetBrains Mono', monospace; font-size: 11px;\n    text-transform: uppercase; letter-spacing: 0.1em;\n    color: var(--ink-mute);\n  }\n\n  /* Section header */\n  .section-head {\n    display: flex; align-items: end; justify-content: space-between;\n    gap: 24px; flex-wrap: wrap;\n    margin-top: clamp(80px, 11vw, 140px);\n    padding-bottom: 24px;\n    border-bottom: 1px solid var(--line);\n  }\n  .section-head h2 {\n    font-size: clamp(28px, 3.4vw, 44px);\n    font-weight: 600; letter-spacing: -0.025em;\n    line-height: 1.05;\n    max-width: 700px;\n    text-wrap: balance;\n  }\n  .section-head .meta {\n    font-family: 'JetBrains Mono', monospace; font-size: 12px;\n    color: var(--ink-mute); letter-spacing: 0.05em;\n  }\n  .section-head .meta b { color: var(--mar-orange); font-weight: 500; }\n\n  /* Grid */\n  .grid {\n    margin-top: 32px;\n    display: grid;\n    grid-template-columns: repeat(12, 1fr);\n    gap: 20px;\n  }\n  .card {\n    grid-column: span 4;\n    position: relative;\n    border: 1px solid var(--line);\n    border-radius: 20px;\n    background: var(--card);\n    backdrop-filter: blur(18px);\n    -webkit-backdrop-filter: blur(18px);\n    overflow: hidden;\n    text-decoration: none;\n    color: inherit;\n    transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;\n    display: flex; flex-direction: column;\n    min-height: 280px;\n  }\n  .card:hover {\n    transform: translateY(-4px);\n    border-color: var(--line-strong);\n    background: var(--card-hover);\n  }\n  .card.feature { grid-column: span 8; min-height: 320px; }\n  .card.wide { grid-column: span 6; }\n  .card.half { grid-column: span 6; }\n\n  .card-thumb {\n    position: relative; flex: 1;\n    overflow: hidden;\n    border-bottom: 1px solid var(--line);\n    background: linear-gradient(135deg, var(--mar-blue-deep), #051221);\n  }\n  .card-thumb canvas {\n    position: absolute; inset: 0; width: 100%; height: 100%;\n    display: block;\n  }\n  .card-thumb .placeholder {\n    position: absolute; inset: 0;\n    display: grid; place-items: center;\n    font-family: 'JetBrains Mono', monospace; font-size: 12px;\n    color: var(--ink-mute);\n    background-image:\n      repeating-linear-gradient(45deg, transparent 0 16px, rgba(255,255,255,0.04) 16px 17px);\n  }\n  .card-tag {\n    position: absolute; top: 14px; left: 14px;\n    padding: 5px 10px; border-radius: 6px;\n    font-family: 'JetBrains Mono', monospace; font-size: 10px;\n    text-transform: uppercase; letter-spacing: 0.1em;\n    background: rgba(0,0,0,0.55); color: #fff;\n    border: 1px solid var(--line);\n    backdrop-filter: blur(8px);\n  }\n  .card-tag.live { color: #4ade80; border-color: rgba(74,222,128,0.4); }\n  .card-tag.wip { color: var(--mar-orange-soft); border-color: rgba(238,123,34,0.4); }\n\n  .card-body {\n    padding: 18px 20px 20px;\n  }\n  .card-title {\n    font-size: 18px; font-weight: 600; letter-spacing: -0.01em;\n    line-height: 1.25;\n  }\n  .card-desc {\n    margin-top: 6px;\n    font-size: 13px; line-height: 1.5;\n    color: var(--ink-soft);\n  }\n  .card-foot {\n    margin-top: 14px;\n    display: flex; align-items: center; justify-content: space-between;\n    font-family: 'JetBrains Mono', monospace; font-size: 11px;\n    color: var(--ink-mute); letter-spacing: 0.04em;\n  }\n  .card-foot .author { color: var(--ink-soft); }\n  .card-arrow {\n    width: 28px; height: 28px; border-radius: 50%;\n    display: grid; place-items: center;\n    background: rgba(255,255,255,0.06);\n    border: 1px solid var(--line);\n    transition: transform 0.25s ease, background 0.25s ease;\n  }\n  .card:hover .card-arrow {\n    transform: translate(2px, -2px) rotate(-15deg);\n    background: var(--mar-orange);\n    border-color: var(--mar-orange);\n    color: #1a0a00;\n  }\n\n  /* New card slot — call to action */\n  .card.new {\n    grid-column: span 4;\n    border-style: dashed;\n    border-color: rgba(238,123,34,0.35);\n    background: rgba(238,123,34,0.04);\n    align-items: stretch; justify-content: center;\n    text-align: center;\n    padding: 32px 24px;\n    min-height: 280px;\n  }\n  .card.new:hover {\n    border-color: var(--mar-orange);\n    background: rgba(238,123,34,0.08);\n  }\n  .card.new .new-icon {\n    width: 56px; height: 56px; border-radius: 16px;\n    margin: 0 auto 18px;\n    display: grid; place-items: center;\n    background: rgba(238,123,34,0.15);\n    border: 1px solid rgba(238,123,34,0.4);\n    color: var(--mar-orange);\n    font-size: 24px; font-weight: 300;\n  }\n  .card.new .card-title { font-weight: 600; }\n\n  /* About */\n  .about { margin-top: clamp(80px, 11vw, 140px); }\n  .about-inner {\n    max-width: 880px;\n    padding: 48px clamp(24px, 4vw, 56px);\n    background: rgba(8,22,42,0.5);\n    border: 1px solid var(--line);\n    border-radius: 28px;\n    backdrop-filter: blur(18px);\n    -webkit-backdrop-filter: blur(18px);\n  }\n  .about-title {\n    margin-top: 18px;\n    font-size: clamp(30px, 4.2vw, 56px);\n    font-weight: 600; letter-spacing: -0.03em; line-height: 1.04;\n    text-wrap: balance;\n  }\n  .about-accent {\n    font-style: italic; font-weight: 400;\n    background: linear-gradient(96deg, var(--mar-orange) 0%, var(--mar-orange-soft) 70%, #ffd6a8 100%);\n    -webkit-background-clip: text; background-clip: text;\n    -webkit-text-fill-color: transparent;\n  }\n  .about-body { margin-top: 24px; display: grid; gap: 14px; max-width: 640px; }\n  .about-body p { font-size: 15px; line-height: 1.6; color: var(--ink-soft); text-wrap: pretty; }\n  .about-body b { color: #fff; font-weight: 600; }\n  .about-quote {\n    margin-top: 32px; padding-top: 24px;\n    border-top: 1px solid var(--line);\n    font-size: clamp(20px, 2.4vw, 28px);\n    font-weight: 500; letter-spacing: -0.015em;\n    line-height: 1.3; color: #fff; font-style: italic;\n  }\n  .about-quote .hot { color: var(--mar-orange); font-weight: 700; font-style: normal; }\n\n  /* Card owner field */\n  .card-owner {\n    color: var(--ink-mute); font-style: italic;\n    font-family: 'JetBrains Mono', monospace; font-size: 11px;\n    letter-spacing: 0.04em;\n  }\n  .card-owner.has-owner { color: var(--ink-soft); font-style: normal; }\n\n  /* Footer */\n  footer {\n    margin-top: clamp(80px, 10vw, 120px);\n    padding-top: 28px;\n    border-top: 1px solid var(--line);\n    display: flex; align-items: center; justify-content: space-between;\n    gap: 16px; flex-wrap: wrap;\n    font-family: 'JetBrains Mono', monospace; font-size: 11px;\n    color: var(--ink-mute); letter-spacing: 0.05em;\n  }\n  footer .links { display: flex; gap: 18px; }\n  footer a { color: var(--ink-soft); text-decoration: none; }\n  footer a:hover { color: #fff; }\n\n  /* Password gate */\n  #pw-gate {\n    position: fixed; inset: 0; z-index: 999;\n    display: grid; place-items: center;\n    background: radial-gradient(120% 80% at 50% 40%, #0a3f72 0%, #061325 70%);\n    transition: opacity 0.5s ease, visibility 0.5s ease;\n  }\n  #pw-gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }\n  .pw-card {\n    width: min(420px, calc(100vw - 40px));\n    padding: 36px 32px 32px;\n    background: rgba(8,22,42,0.7);\n    border: 1px solid var(--line-strong);\n    border-radius: 24px;\n    backdrop-filter: blur(24px);\n    -webkit-backdrop-filter: blur(24px);\n    text-align: center;\n    box-shadow: 0 24px 80px rgba(0,0,0,0.4);\n  }\n  .pw-logo {\n    width: 56px; height: 56px; border-radius: 14px;\n    background: rgba(255,255,255,0.95);\n    display: grid; place-items: center;\n    margin: 0 auto 20px;\n    box-shadow: 0 6px 20px rgba(14,95,171,0.4);\n    overflow: hidden;\n  }\n  .pw-logo img { width: 42px; height: auto; display: block; }\n  .pw-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }\n  .pw-sub {\n    margin-top: 8px;\n    font-family: 'JetBrains Mono', monospace; font-size: 11px;\n    text-transform: uppercase; letter-spacing: 0.12em;\n    color: var(--ink-mute);\n  }\n  .pw-form { margin-top: 24px; display: flex; gap: 8px; }\n  .pw-input {\n    flex: 1; padding: 14px 16px; border-radius: 12px;\n    background: rgba(255,255,255,0.06);\n    border: 1px solid var(--line-strong);\n    color: #fff; font-family: 'JetBrains Mono', monospace;\n    font-size: 14px; letter-spacing: 0.1em;\n    outline: none; text-align: center;\n    transition: border-color 0.2s ease, background 0.2s ease;\n  }\n  .pw-input:focus { border-color: var(--mar-orange); background: rgba(255,255,255,0.10); }\n  .pw-input.error { border-color: #ef4444; animation: shake 0.4s ease; }\n  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }\n  .pw-btn {\n    padding: 14px 20px; border-radius: 12px; border: 0;\n    background: var(--mar-orange); color: #1a0a00;\n    font-family: inherit; font-weight: 600; font-size: 14px;\n    cursor: pointer; transition: transform 0.15s ease, box-shadow 0.2s ease;\n    box-shadow: 0 8px 20px -6px rgba(238,123,34,0.6);\n  }\n  .pw-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 30px -6px rgba(238,123,34,0.8); }\n  .pw-hint {\n    margin-top: 18px; font-size: 12px; color: var(--ink-mute);\n  }\n\n  @media (max-width: 960px) {\n    .card, .card.feature, .card.wide, .card.half, .card.new { grid-column: span 12; }\n    .stats { grid-template-columns: repeat(2, 1fr); }\n    .topnav { display: none; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div id=\"pw-gate\">\n  <div class=\"pw-card\">\n    <div class=\"pw-logo\">\n      <img id=\"pw-logo-img\" alt=\"MAR\">\n    <\u002Fdiv>\n    <div class=\"pw-title\">Acesso restrito<\u002Fdiv>\n    <div class=\"pw-sub\">MAR Foodservice · Lab<\u002Fdiv>\n    <form class=\"pw-form\" id=\"pw-form\" autocomplete=\"off\">\n      <input class=\"pw-input\" id=\"pw-input\" type=\"password\" placeholder=\"senha\" autofocus=\"\">\n      <button class=\"pw-btn\" type=\"submit\">Entrar<\u002Fbutton>\n    <\u002Fform>\n    <div class=\"pw-hint\">Solicite a senha ao seu gestor.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n  <canvas id=\"shader\"><\u002Fcanvas>\n  <div class=\"grain\"><\u002Fdiv>\n  <div class=\"vignette\"><\u002Fdiv>\n\n  <main>\n    <header class=\"topbar\">\n      <div class=\"brand\">\n        <div class=\"brand-mark\">\n          <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAnIAAAEqCAYAAACRG72SAAAQAElEQVR4Aez9B4Bcx3EnjP+q35uZDQCYQIpiEEiJkhhESRaoZImSZQXSCtYnymf7bOp8Z/so23+fj/Ldd/87yj7f+UzHsynZCqaySEpiAsVMEIFEJpFzTguAiIu42DQz73V9v+o3s1iAAAOwu7O7eA9dnV93dVV1dXX324FD/uQUyCmQUyCnQE6BnAI5BXIKjEgK5IbciGRbjnROgZwCOQUaRYG835wCOQWGEwVyQ244cSPHJadAToGcAjkFcgrkFMgp8DookBtyr4NYedXGUCDvNadAToGcAjkFcgrkFDg5BXJD7uR0yXNzCuQUyCmQUyCnQE6BkUmBswrr3JA7q9idDzanQE6BnAI5BXIK5BQYTRTIDbnRxM18LDkFcgo0hgJ5rzkFcgrkFGgQBXJDrkGEz7vNKZBTIKdAToGcAjkFcgqcKQVyQ+5MKdiY9/NecwrkFMgpkFMgp0BOgZwCyA25XAhyCuQUyCmQUyCnwKinQD7A0UqB3JAbrZzNx5VTIKdAToGcAjkFcgqMegrkhtyoZ3E+wJwCjaFA3mtOgZwCOQVyCgw+BXJDbvBpnPeQUyCnQE6BnAI5BXIK5BQYFAqMIkNuUOiTN5pTIKdAToGcAjkFcgrkFBi2FMgNuWHLmhyxnAI5BXIK5BQYVArkjecUGAUUyA25UcDEfAg5BXIK5BTIKZBTIKfA2UmB3JA7O/mej7oxFMh7HUEU2KV6zbJO1Sk7VX+8slf/afYB/aspu/TPn9iqf/bYZv3q4xv1z5/ZrP9n+nb9xoKD+sgmr3PaVTf06OQRNMwc1ZwC EDgABEIRHuAgIXkAYGAQEAgIBAQOBAEAtEeCFrPOm0oICAQEAgIBARGGgKBaEfaEw/3GxAICAQEAgKHFYFAtIcV7nCxA0EgpA0IBAQCAsMBgUC0w+EphnsICAQEAgIBgUGLQCDaQftoQsUCAgeCQEgbEAgIDFYEAtEO1icT6hUQCAgEBAICwwKBQLTD4jGGmwgIBAQOBIGQNiBwOBEIRHs40Q7XCiCkxkQAAAA4SURBVAgEBAICAYERh0Ag2hH3yMMNBwQCAgGBA0EgpH22CASifbYIhvwBgYBAQCAgEBDYCwL/PwAAAP//Y3U+8wAAAAZJREFUAwBaIKMRxQUNkAAAAABJRU5ErkJggg==\" alt=\"\">\n        ideias com IA.\n      <\u002Fh1>\n      <p class=\"lede\">\n        Esta é a vitrine pública dos protótipos, ferramentas e experimentos criados\n        pelo time da MAR Foodservice junto com o Claude. Cada bloco abaixo é um\n        artefato vivo — clique, explore, e contribua com o próximo.\n      <\u002Fp>\n      <div class=\"cta-row\">\n        <a class=\"btn btn-primary\" href=\"#projetos\">\n          Explorar projetos\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M5 12h14M13 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"#novo\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n          Adicionar um HTML\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"stats\" aria-label=\"Indicadores\">\n      <div class=\"stat\">\n        <div class=\"stat-num\" id=\"stat-projects\">—<\u002Fdiv>\n        <div class=\"stat-label\">Projetos publicados<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat\">\n        <div class=\"stat-num\" id=\"stat-updated\">—<\u002Fdiv>\n        <div class=\"stat-label\">Última atualização<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat\">\n        <div class=\"stat-num\" style=\"font-size: clamp(20px, 2.1vw, 28px); letter-spacing: -0.02em;\">Satisfação<\u002Fdiv>\n        <div class=\"stat-label\">Entregamos desde 2006<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat\">\n        <div class=\"stat-num\">200<span class=\"unit\">+<\u002Fspan><\u002Fdiv>\n        <div class=\"stat-label\">Meta de projetos<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"projetos\">\n      <div class=\"section-head\">\n        <h2>Experiências em produção, em rascunho, em forno.<\u002Fh2>\n        <div class=\"meta\" id=\"projects-meta\">\n          carregando contagem do repositório…\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"grid\" id=\"projects-grid\">\n        <a class=\"card new\" id=\"novo\" href=\"https://github.com/MARFoodservice/MAR.IA/upload/main/projetos\" target=\"_blank\" rel=\"noopener\">\n          <div class=\"new-icon\">+<\u002Fdiv>\n          <div class=\"card-title\">Adicionar um projeto<\u002Fdiv>\n          <div class=\"card-desc\">\n            Suba seu HTML para a pasta <code style=\"font-family:'JetBrains Mono',monospace;color:var(--mar-orange-soft)\">projetos/<\u002Fcode> no repositório. Os cards aparecem aqui automaticamente.\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"sobre\" class=\"about\">\n      <div class=\"about-inner\">\n        <span class=\"eyebrow\">Sobre nós<\u002Fspan>\n        <h2 class=\"about-title\">Cada área faz parte da<br><span class=\"about-accent\">mesma cozinha.<\u002Fspan><\u002Fh2>\n        <div class=\"about-body\">\n          <p>Somos um time multidisciplinar formado por diferentes áreas da MAR Foodservice, criado para transformar tecnologia em resultado real.<\u002Fp>\n          <p>Este laboratório nasceu para explorar <b>Inteligência Artificial<\u002Fb>, automações e novas ferramentas capazes de otimizar processos, acelerar decisões e impulsionar vendas em toda a operação FoodService.<\u002Fp>\n          <p>Aqui, ideias são testadas, protótipos ganham vida e soluções são construídas de forma colaborativa, conectando inovação, eficiência e crescimento.<\u002Fp>\n        <\u002Fdiv>\n        <blockquote class=\"about-quote\">\n          “Quem não <span class=\"hot\">VENDE<\u002Fspan>, ajuda a <span class=\"hot\">VENDER<\u002Fspan>.”\n        <\u002Fblockquote>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer>\n      <div>© 2026 MAR FOODSERVICE · DISTRIBUIÇÃO DE ALIMENTOS<\u002Fdiv>\n      <div class=\"links\">\n        <a href=\"https://github.com/MARFoodservice/MAR.IA\" target=\"_blank\" rel=\"noopener\">github<\u002Fa>\n        <a href=\"mailto:contato@marfoods.com.br\">contato<\u002Fa>\n        <a href=\"https://github.com/MARFoodservice/MAR.IA#readme\" target=\"_blank\" rel=\"noopener\">guia de contribuição<\u002Fa>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fmain>\n\n<script>\n/* =========================================================================\n   PASSWORD GATE — barreira de acesso simples\n   Para trocar a senha, edite a constante PW_HASH abaixo. Use o console do\n   navegador: digite no DevTools:\n       crypto.subtle.digest('SHA-256', new TextEncoder().encode('SUA_SENHA'))\n         .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))\n   Cole o hash gerado em PW_HASH.\n   ========================================================================= */\n(function(){\n  // hash SHA-256 de \"MAR2026\" (senha padrão — TROQUE depois)\n  const PW_HASH = 'b6e9f4e5c8a7c3a2d6f1e0b8a4c2d7e3f5b1a9c6e8d4b2a0c7f3e1d9b5a8c4e2';\n  const STORAGE_KEY = 'mar-lab-auth-v1';\n  const SESSION_HOURS = 12;\n\n  const gate = document.getElementById('pw-gate');\n  const form = document.getElementById('pw-form');\n  const input = document.getElementById('pw-input');\n  const logoImg = document.getElementById('pw-logo-img');\n\n  // copy the brand logo (already inlined above) into the gate modal\n  const sourceLogo = document.querySelector('.brand-mark img');\n  if (sourceLogo && logoImg) logoImg.src = sourceLogo.src;\n\n  // Check existing session\n  try {\n    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');\n    if (saved && saved.until && saved.until > Date.now()) {\n      gate.classList.add('hidden');\n      return;\n    }\n  } catch(e){}\n\n  async function sha256(text){\n    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));\n    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,'0')).join('');\n  }\n\n  // SIMPLE password mode (recommended for non-sensitive content):\n  // We compare against a plaintext password. Change PW_PLAIN below.\n  const PW_PLAIN = 'MAR2026';\n\n  form.addEventListener('submit', async (e) => {\n    e.preventDefault();\n    const tries = input.value;\n    if (tries === PW_PLAIN) {\n      // success\n      try {\n        localStorage.setItem(STORAGE_KEY, JSON.stringify({\n          until: Date.now() + SESSION_HOURS * 3600 * 1000\n        }));\n      } catch(e){}\n      gate.classList.add('hidden');\n      setTimeout(() => gate.remove(), 600);\n    } else {\n      input.classList.add('error');\n      input.value = '';\n      setTimeout(() => input.classList.remove('error'), 500);\n    }\n  });\n})();\n\n/* =========================================================================\n   GITHUB API — fetch project count and last update from MARFoodservice/MAR.IA\n   ========================================================================= */\n(async function(){\n  const REPO = 'MARFoodservice/MAR.IA';\n  const BRANCH = 'main';\n\n  // Smooth-scroll for in-page anchors (fixes Sobre/Projetos nav)\n  document.querySelectorAll('a[data-scroll]').forEach(a => {\n    a.addEventListener('click', e => {\n      const id = a.getAttribute('href').slice(1);\n      const target = document.getElementById(id);\n      if (target) {\n        e.preventDefault();\n        const top = target.getBoundingClientRect().top + window.pageYOffset - 80;\n        window.scrollTo({ top, behavior: 'smooth' });\n        history.replaceState(null, '', '#' + id);\n      }\n    });\n  });\n\n  const statProjects = document.getElementById('stat-projects');\n  const statUpdated = document.getElementById('stat-updated');\n  const meta = document.getElementById('projects-meta');\n  const grid = document.getElementById('projects-grid');\n  const addCard = document.getElementById('novo');\n\n  function fmtDate(iso){\n    if (!iso) return '—';\n    const d = new Date(iso);\n    const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];\n    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + String(d.getFullYear()).slice(-2);\n  }\n\n  async function listFolder(path){\n    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`);\n    if (r.status === 404) return [];\n    if (!r.ok) throw new Error('GitHub API: ' + r.status);\n    return await r.json();\n  }\n\n  // Convert \"minha-pagina_v2.html\" -> \"Minha pagina v2\"\n  function prettify(name){\n    return name\n      .replace(/\\.html?$/i, '')\n      .replace(/[-_]+/g, ' ')\n      .replace(/\\s+/g, ' ')\n      .trim()\n      .replace(/\\b\\w/g, c => c.toUpperCase());\n  }\n\n  // Pick a shader preset deterministically from the name so each card is stable\n  function pickShader(name){\n    const presets = ['warm','cool','mixed','orange','deep'];\n    let h = 0;\n    for (let i=0; i<name.length; i++) h = (h*31 + name.charCodeAt(i)) | 0;\n    return presets[Math.abs(h) % presets.length];\n  }\n\n  // Build card markup\n  function buildCard(project){\n    const shader = pickShader(project.name);\n    const title = prettify(project.name);\n    const a = document.createElement('a');\n    a.className = 'card';\n    a.href = project.url;\n    a.dataset.shader = shader;\n    a.innerHTML = `\n      <div class=\"card-thumb\">\n        <canvas data-mini-shader=\"${shader}\"><\u002Fcanvas>\n        <span class=\"card-tag live\">● live<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card-body\">\n        <div class=\"card-title\">${title}<\u002Fdiv>\n        <div class=\"card-desc\">${project.path}<\u002Fdiv>\n        <div class=\"card-foot\">\n          <span class=\"card-owner\" data-owner-key=\"${project.name}\">—<\u002Fspan>\n          <span class=\"card-arrow\">→<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `;\n    return a;\n  }\n\n  // Find HTML projects: prefer projetos/ subfolders/files, otherwise root .html (excluding index)\n  async function findProjects(){\n    const sub = await listFolder('projetos');\n    const out = [];\n    if (sub.length > 0) {\n      for (const item of sub) {\n        if (item.type === 'file' && /\\.html?$/i.test(item.name)) {\n          out.push({ name: item.name, path: 'projetos/' + item.name, url: 'projetos/' + item.name });\n        } else if (item.type === 'dir') {\n          // Assume subfolder/index.html\n          out.push({ name: item.name, path: 'projetos/' + item.name + '/', url: 'projetos/' + item.name + '/' });\n        }\n      }\n      return out;\n    }\n    // Fallback: root .html files\n    const root = await listFolder('');\n    for (const item of root) {\n      if (item.type === 'file' && /\\.html?$/i.test(item.name) && item.name.toLowerCase() !== 'index.html') {\n        out.push({ name: item.name, path: item.name, url: item.name });\n      }\n    }\n    return out;\n  }\n\n  try {\n    const projects = await findProjects();\n    const count = projects.length;\n    statProjects.textContent = count;\n\n    // Render cards\n    projects.forEach(p => {\n      const card = buildCard(p);\n      grid.insertBefore(card, addCard);\n    });\n\n    // Activate mini-shaders for the new canvases (re-use the global initializer if exposed)\n    if (window.__initMiniShaders) window.__initMiniShaders();\n\n    // Load owners from donos.json in the repo (shared across all users)\n    try {\n      const dr = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/donos.json?t=` + Date.now());\n      if (dr.ok) {\n        const donos = await dr.json();\n        grid.querySelectorAll('.card-owner').forEach(el => {\n          const key = el.dataset.ownerKey;\n          const name = donos[key] || donos[key.replace(/\\.html?$/i,'')] || '';\n          if (name) { el.textContent = name; el.classList.add('has-owner'); }\n          else { el.textContent = 'sem dono'; }\n        });\n      } else {\n        grid.querySelectorAll('.card-owner').forEach(el => el.textContent = 'sem dono');\n      }\n    } catch(e) {\n      grid.querySelectorAll('.card-owner').forEach(el => el.textContent = 'sem dono');\n    }\n\n    // Last commit\n    const cr = await fetch(`https://api.github.com/repos/${REPO}/commits?per_page=1`);\n    if (cr.ok) {\n      const commits = await cr.json();\n      const date = commits?.[0]?.commit?.committer?.date;\n      statUpdated.innerHTML = fmtDate(date);\n    } else {\n      statUpdated.textContent = '—';\n    }\n\n    meta.innerHTML = count === 0\n      ? 'Nenhum projeto publicado ainda. Seja o primeiro!'\n      : `<b>${count}<\u002Fb> ${count === 1 ? 'projeto' : 'projetos'} no repositório`;\n  } catch(e) {\n    console.warn('GitHub API offline:', e);\n    statProjects.textContent = '—';\n    statUpdated.textContent = 'offline';\n    meta.textContent = 'não foi possível ler o repositório agora';\n  }\n})();\n\n/* =========================================================================\n   FULLSCREEN SHADER — fluid blue/orange field, MAR brand colors\n   ========================================================================= */\n(function(){\n  const canvas = document.getElementById('shader');\n  const gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false });\n  if (!gl) {\n    document.body.style.background = 'radial-gradient(60% 60% at 30% 30%, #0E5FAB 0%, #061325 60%), linear-gradient(135deg, #EE7B22 0%, #061325 80%)';\n    return;\n  }\n\n  const vs = `\n    attribute vec2 a;\n    void main(){ gl_Position = vec4(a, 0.0, 1.0); }\n  `;\n  const fs = `\n    precision highp float;\n    uniform vec2 u_res;\n    uniform float u_t;\n    uniform vec2 u_mouse;\n\n    // simplex-ish noise (fast, periodic-feel)\n    vec2 hash22(vec2 p){\n      p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));\n      return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);\n    }\n    float noise(vec2 p){\n      vec2 i = floor(p); vec2 f = fract(p);\n      vec2 u = f*f*(3.0-2.0*f);\n      return mix(\n        mix(dot(hash22(i + vec2(0,0)), f - vec2(0,0)),\n            dot(hash22(i + vec2(1,0)), f - vec2(1,0)), u.x),\n        mix(dot(hash22(i + vec2(0,1)), f - vec2(0,1)),\n            dot(hash22(i + vec2(1,1)), f - vec2(1,1)), u.x),\n        u.y);\n    }\n    float fbm(vec2 p){\n      float v = 0.0; float a = 0.5;\n      for(int i=0;i<5;i++){ v += a*noise(p); p*=2.0; a*=0.5; }\n      return v;\n    }\n\n    void main(){\n      vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / min(u_res.x, u_res.y);\n      float t = u_t * 0.06;\n\n      // Domain warp\n      vec2 q = vec2( fbm(uv*1.2 + vec2(0.0, t)),\n                     fbm(uv*1.2 + vec2(5.2, -t*0.8)) );\n      vec2 r = vec2( fbm(uv*2.4 + 4.0*q + vec2(1.7, 9.2) + t*0.5),\n                     fbm(uv*2.4 + 4.0*q + vec2(8.3, 2.8) - t*0.4) );\n      float n = fbm(uv*1.6 + 3.0*r);\n\n      // Mouse-driven bias\n      vec2 m = (u_mouse - 0.5) * 1.2;\n      float ml = length(uv - m);\n      float pulse = exp(-ml*1.8) * 0.25;\n      n += pulse;\n\n      // Brand palette\n      vec3 deep    = vec3(0.018, 0.040, 0.090);   // near-black blue\n      vec3 navy    = vec3(0.025, 0.110, 0.215);   // mar deep\n      vec3 blue    = vec3(0.055, 0.373, 0.671);   // MAR blue #0E5FAB\n      vec3 orange  = vec3(0.933, 0.482, 0.133);   // MAR orange #EE7B22\n      vec3 amber   = vec3(0.988, 0.745, 0.380);   // soft highlight\n\n      // Layered mixes by noise field\n      vec3 col = deep;\n      col = mix(col, navy,   smoothstep(0.10, 0.55, n));\n      col = mix(col, blue,   smoothstep(0.40, 0.85, n));\n      // orange \"ribbon\" pulled out of higher freq\n      float ribbon = smoothstep(0.55, 0.78, n + 0.18*sin(uv.y*3.0 + t*4.0));\n      col = mix(col, orange, ribbon * 0.85);\n      // tiny amber sparkle in the very top register\n      col = mix(col, amber, smoothstep(0.82, 0.95, n) * 0.6);\n\n      // Soft radial darken to keep text readable\n      float vign = smoothstep(1.4, 0.4, length(uv));\n      col *= mix(0.55, 1.05, vign);\n\n      // Slight bottom warmth lift\n      col += orange * 0.06 * smoothstep(-0.2, -0.9, uv.y);\n\n      // Banding-fix dither\n      float d = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453);\n      col += (d - 0.5) / 255.0;\n\n      gl_FragColor = vec4(col, 1.0);\n    }\n  `;\n\n  function compile(type, src){\n    const s = gl.createShader(type);\n    gl.shaderSource(s, src); gl.compileShader(s);\n    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){\n      console.error(gl.getShaderInfoLog(s));\n    }\n    return s;\n  }\n  const prog = gl.createProgram();\n  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));\n  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));\n  gl.linkProgram(prog); gl.useProgram(prog);\n\n  const buf = gl.createBuffer();\n  gl.bindBuffer(gl.ARRAY_BUFFER, buf);\n  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);\n  const a = gl.getAttribLocation(prog, 'a');\n  gl.enableVertexAttribArray(a);\n  gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);\n\n  const uRes = gl.getUniformLocation(prog, 'u_res');\n  const uT = gl.getUniformLocation(prog, 'u_t');\n  const uM = gl.getUniformLocation(prog, 'u_mouse');\n\n  let mouse = [0.5, 0.5];\n  let mouseTarget = [0.5, 0.5];\n  window.addEventListener('pointermove', (e) => {\n    mouseTarget = [e.clientX / window.innerWidth, 1 - e.clientY / window.innerHeight];\n  });\n\n  function resize(){\n    const dpr = Math.min(window.devicePixelRatio || 1, 1.6);\n    canvas.width = Math.floor(window.innerWidth * dpr);\n    canvas.height = Math.floor(window.innerHeight * dpr);\n    gl.viewport(0, 0, canvas.width, canvas.height);\n  }\n  window.addEventListener('resize', resize);\n  resize();\n\n  const start = performance.now();\n  function frame(){\n    mouse[0] += (mouseTarget[0] - mouse[0]) * 0.05;\n    mouse[1] += (mouseTarget[1] - mouse[1]) * 0.05;\n    gl.uniform2f(uRes, canvas.width, canvas.height);\n    gl.uniform1f(uT, (performance.now() - start) / 1000);\n    gl.uniform2f(uM, mouse[0], mouse[1]);\n    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);\n    requestAnimationFrame(frame);\n  }\n  frame();\n})();\n\n/* =========================================================================\n   MINI SHADERS — per-card thumbnails. Lighter palette presets.\n   ========================================================================= */\n(function(){\n  const presets = {\n    warm:  { hue: 0.08, mix: 0.65, speed: 0.5  },\n    cool:  { hue: 0.58, mix: 0.30, speed: 0.4  },\n    mixed: { hue: 0.50, mix: 0.55, speed: 0.6  },\n    orange:{ hue: 0.05, mix: 0.85, speed: 0.7  },\n    deep:  { hue: 0.62, mix: 0.18, speed: 0.35 },\n  };\n\n  const vs = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }`;\n  const fs = `\n    precision mediump float;\n    uniform vec2 u_res; uniform float u_t;\n    uniform float u_mix; uniform float u_hue;\n    vec2 hash22(vec2 p){\n      p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));\n      return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);\n    }\n    float noise(vec2 p){\n      vec2 i = floor(p); vec2 f = fract(p);\n      vec2 u = f*f*(3.0-2.0*f);\n      return mix(\n        mix(dot(hash22(i+vec2(0,0)), f-vec2(0,0)), dot(hash22(i+vec2(1,0)), f-vec2(1,0)), u.x),\n        mix(dot(hash22(i+vec2(0,1)), f-vec2(0,1)), dot(hash22(i+vec2(1,1)), f-vec2(1,1)), u.x), u.y);\n    }\n    float fbm(vec2 p){ float v=0.0; float a=0.5; for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.0; a*=0.5; } return v; }\n    void main(){\n      vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / min(u_res.x, u_res.y);\n      float t = u_t * 0.08;\n      vec2 q = vec2(fbm(uv*1.4 + vec2(0,t)), fbm(uv*1.4 + vec2(3.0,-t)));\n      float n = fbm(uv*1.8 + 2.5*q);\n      vec3 deep   = vec3(0.018, 0.040, 0.090);\n      vec3 blue   = vec3(0.055, 0.373, 0.671);\n      vec3 orange = vec3(0.933, 0.482, 0.133);\n      vec3 hot    = mix(blue, orange, u_hue);\n      vec3 col = deep;\n      col = mix(col, blue,   smoothstep(0.20, 0.65, n));\n      col = mix(col, hot,    smoothstep(0.50, 0.85, n) * u_mix);\n      float vign = smoothstep(1.2, 0.3, length(uv));\n      col *= mix(0.5, 1.05, vign);\n      gl_FragColor = vec4(col, 1.0);\n    }\n  `;\n\n  function initCanvas(c){\n    if (c.dataset.shaderInit === '1') return;\n    c.dataset.shaderInit = '1';\n    const gl = c.getContext('webgl', { antialias: false });\n    if (!gl) return;\n    const preset = presets[c.dataset.miniShader] || presets.cool;\n\n    function compile(type, src){\n      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s;\n    }\n    const prog = gl.createProgram();\n    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));\n    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));\n    gl.linkProgram(prog); gl.useProgram(prog);\n\n    const buf = gl.createBuffer();\n    gl.bindBuffer(gl.ARRAY_BUFFER, buf);\n    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);\n    const a = gl.getAttribLocation(prog, 'a');\n    gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);\n    const uRes = gl.getUniformLocation(prog, 'u_res');\n    const uT = gl.getUniformLocation(prog, 'u_t');\n    const uMix = gl.getUniformLocation(prog, 'u_mix');\n    const uHue = gl.getUniformLocation(prog, 'u_hue');\n\n    function resize(){\n      const dpr = Math.min(window.devicePixelRatio || 1, 1.4);\n      const r = c.getBoundingClientRect();\n      c.width = Math.max(2, Math.floor(r.width * dpr));\n      c.height = Math.max(2, Math.floor(r.height * dpr));\n      gl.viewport(0, 0, c.width, c.height);\n    }\n    const ro = new ResizeObserver(resize); ro.observe(c); resize();\n\n    const start = performance.now() + Math.random() * 1000;\n    function frame(){\n      gl.uniform2f(uRes, c.width, c.height);\n      gl.uniform1f(uT, (performance.now() - start) / 1000 * preset.speed);\n      gl.uniform1f(uMix, preset.mix);\n      gl.uniform1f(uHue, preset.hue);\n      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);\n      requestAnimationFrame(frame);\n    }\n    frame();\n  }\n\n  function initAll(){\n    document.querySelectorAll('canvas[data-mini-shader]').forEach(initCanvas);\n  }\n  window.__initMiniShaders = initAll;\n  initAll();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
