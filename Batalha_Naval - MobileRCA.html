<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batalha Naval — Mix Campeão</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0a1628;--navy-mid:#112240;--navy-light:#1e3a5f;
  --ocean:#0d4f8c;--wave:#1a7abf;--foam:#5bc4f5;
  --alert:#ff4d4d;--gold:#f5a623;--success:#2ecc71;
  --text:#e8f4f8;--text-dim:#8bafc2;--border:rgba(91,196,245,0.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;font-size:14px}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0a1628 0%,#0d2d52 50%,#0a1628 100%)}
.logo-wrap{background:#fff;border-radius:14px;padding:14px 28px;margin-bottom:12px;box-shadow:0 4px 24px rgba(0,0,0,0.3)}
.logo-wrap img{height:60px;width:auto;display:block}
.login-sub{font-size:12px;color:var(--text-dim);margin-bottom:36px;letter-spacing:1px;text-align:center}
.login-card{background:var(--navy-mid);border:1px solid var(--border);border-radius:12px;padding:28px 24px;width:100%;max-width:360px}
.login-card h2{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--foam);margin-bottom:20px}
.f-label{font-size:11px;color:var(--text-dim);margin-bottom:5px;font-weight:600;letter-spacing:.5px;display:block}
.f-input{width:100%;background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:15px;margin-bottom:14px;outline:none;transition:border-color .2s}
.f-input:focus{border-color:var(--foam)}
.btn-login{width:100%;background:var(--ocean);color:#fff;border:none;border-radius:8px;padding:13px;font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;letter-spacing:1px;cursor:pointer}
.btn-login:hover{background:var(--wave)}
.login-err{color:var(--alert);font-size:13px;margin-top:10px;text-align:center;display:none}
.login-hint{font-size:11px;color:var(--text-dim);margin-top:14px;text-align:center}

/* APP */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden}

/* FAIXA BRANCA MAR */
.top-bar{background:#fff;padding:8px 20px;border-bottom:3px solid #f5a623;display:flex;align-items:center;flex-shrink:0}
.top-bar img{height:40px;width:auto}

/* HEADER */
.app-header{background:var(--navy-mid);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;flex-wrap:wrap;gap:8px}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-batalha-logo{height:40px;width:auto}
.hdr-title{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:var(--foam);letter-spacing:1px;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:12px}
.hdr-info{text-align:right;line-height:1.5}
.hdr-id{font-size:11px;color:var(--text-dim)}
.hdr-nome{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.hdr-sup{font-size:11px;color:var(--text-dim)}
.btn-sair{background:none;border:1px solid var(--border);color:var(--text-dim);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap}
.btn-sair:hover{border-color:var(--alert);color:var(--alert)}

/* STATS BAR */
.stats-bar{background:var(--navy-mid);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.stats-bar::-webkit-scrollbar{display:none}
.stat-item{flex:1;min-width:80px;padding:6px 10px;text-align:center;border-right:1px solid var(--border);white-space:nowrap}
.stat-item:last-child{border-right:none}
.stat-val{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;line-height:1}
.stat-lbl{font-size:9px;color:var(--text-dim);margin-top:1px}
.stat-item.s-alert .stat-val{color:var(--alert)}
.stat-item.s-gold .stat-val{color:var(--gold)}
.stat-item.s-success .stat-val{color:var(--success)}
.stat-item.s-foam .stat-val{color:var(--foam)}
.stat-periodo{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;color:var(--foam)}

/* FILTERS */
.filters-bar{background:var(--navy-mid);border-bottom:1px solid var(--border);padding:6px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.f-sel,.f-txt{background:var(--navy);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-size:13px;outline:none;min-width:0}
.period-wrap{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-dim);white-space:nowrap}
.period-wrap input[type=date]{background:var(--navy);border:1px solid var(--border);border-radius:6px;padding:5px 6px;color:var(--text);font-size:11px;outline:none}
.btn-go{background:var(--ocean);border:none;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-family:'Rajdhani',sans-serif;font-weight:700;cursor:pointer;white-space:nowrap}

/* MAIN LAYOUT */
.main-layout{display:flex;flex:1;overflow:hidden}

/* CLIENT LIST */
.client-list-wrap{width:220px;min-width:180px;border-right:1px solid var(--border);overflow-y:auto;background:var(--navy-mid);flex-shrink:0}
.list-count{font-size:10px;color:var(--text-dim);padding:6px 10px;border-bottom:1px solid var(--border);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.client-item{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.client-item:hover,.client-item.active{background:var(--navy-light)}
.client-item.active{border-left:3px solid var(--foam)}
.ci-name{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;margin-bottom:2px;line-height:1.2}
.ci-fat{font-size:10px;color:var(--text-dim);margin-bottom:1px;display:flex;align-items:center;gap:4px}
.ci-ramo{background:rgba(91,196,245,.1);color:var(--foam);padding:1px 4px;border-radius:3px;font-size:9px}
.ci-rca{font-size:9px;color:var(--text-dim);margin-bottom:3px}
.cov-bar-wrap{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-bottom:2px}
.cov-bar-fill{height:100%;border-radius:2px}
.ci-pct{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700}

/* DETAIL PANEL */
.detail-panel{flex:1;overflow-y:auto}

/* RAMOS VIEW */
.ramos-header{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--navy-mid)}
.ramos-title{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--foam);margin-bottom:4px}
.ramos-sub{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.ramos-list{padding:10px}
.ramo-card{background:var(--navy-mid);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .2s}
.ramo-card:hover{border-color:var(--foam)}
.ramo-card-left{flex:1;min-width:0}
.ramo-card-nome{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;margin-bottom:6px}
.ramo-card-meta{font-size:12px;color:var(--text-dim);display:flex;gap:12px}
.ramo-card-pct{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;min-width:64px;text-align:right}
.sem-config-label{font-size:11px;color:var(--text-dim);padding:8px 4px;text-align:center}

/* DETALHE CLIENTE */
.dh-wrap{background:var(--navy-mid);border-bottom:1px solid var(--border);padding:12px 14px}
.btn-voltar{background:none;border:1px solid var(--border);color:var(--text-dim);padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;margin-bottom:10px;display:inline-flex;align-items:center;gap:4px}
.btn-voltar:hover{border-color:var(--foam);color:var(--foam)}
.dh-nome{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px;line-height:1.2}
.dh-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);margin-bottom:10px}
.tag-ramo{background:var(--ocean);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.dh-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dh-card{background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:10px 8px;text-align:center}
.dh-cv{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;line-height:1}
.dh-cl{font-size:10px;color:var(--text-dim);margin-top:2px}
.dh-card.c-ok .dh-cv{color:var(--success)}
.dh-card.c-nok .dh-cv{color:var(--alert)}
.dh-card.c-foam .dh-cv{color:var(--foam)}

/* DETAIL COLS — desktop side by side, mobile stacked */
.detail-cols{display:grid;grid-template-columns:1fr 1fr 1fr}
.detail-col{border-right:1px solid var(--border);overflow-y:auto}
.detail-col:last-child{border-right:none}
.col-title{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--text-dim);padding:7px 10px;border-bottom:1px solid var(--border);background:var(--navy-mid);position:sticky;top:0;z-index:1;letter-spacing:.3px;text-transform:uppercase;line-height:1.3}

.mix-row{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);font-size:12px}
.mix-row.ok{background:rgba(46,204,113,.04)}
.mix-row.nok{background:rgba(255,77,77,.04)}
.mix-ico{flex-shrink:0;font-size:13px}
.mix-lbl{flex:1;line-height:1.3}
.tag-g{font-size:9px;background:rgba(139,92,246,.2);color:#a78bfa;padding:1px 4px;border-radius:3px;font-weight:700;white-space:nowrap}
.tag-p{font-size:9px;background:rgba(91,196,245,.1);color:var(--foam);padding:1px 4px;border-radius:3px;font-weight:700;white-space:nowrap}

.bench-row{display:flex;align-items:center;gap:4px;padding:5px 10px;border-bottom:1px solid var(--border);font-size:12px}
.bench-pos{color:var(--text-dim);min-width:18px;font-size:11px}
.bench-sub{flex:1;line-height:1.3}
.bench-sub.obrig{color:var(--foam);font-weight:600}
.dot{color:var(--foam);font-size:10px}
.bench-count{color:var(--text-dim);font-size:10px;white-space:nowrap}
.bench-pct{min-width:34px;text-align:right;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;color:var(--gold)}

.comprada-row{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border-bottom:1px solid var(--border);font-size:12px}
.comprada-sub{flex:1;line-height:1.3}
.comprada-sub.obrig{color:var(--foam);font-weight:600}
.comprada-cnt{color:var(--text-dim);font-size:10px;white-space:nowrap}

.fill-high{background:var(--success)}.fill-mid{background:var(--gold)}.fill-low{background:var(--alert)}
.cov-high{color:var(--success)}.cov-mid{color:var(--gold)}.cov-low{color:var(--alert)}.cov-none{color:var(--text-dim)}
.c-success{color:var(--success)}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:var(--text-dim);gap:12px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--foam);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-sm{padding:14px 10px;color:var(--text-dim);font-size:12px;text-align:center}
.empty-detail{display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-dim);font-size:14px}

/* MOBILE RESPONSIVO */
@media(max-width:767px){
  .main-layout{flex-direction:column}
  .client-list-wrap{width:100%;min-width:unset;height:240px;border-right:none;border-bottom:1px solid var(--border)}
  .detail-panel{flex:1}
  .detail-cols{grid-template-columns:1fr}
  .detail-col{border-right:none;border-bottom:1px solid var(--border)}
  .dh-cards{grid-template-columns:repeat(3,1fr)}
  .hdr-title{font-size:14px}
  .ramo-card-pct{font-size:22px}
  .stats-bar{font-size:11px}
}
</style>
</head>

<script>

const SB_URL='https://ctbbyhjjskvgxodshhhc.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0YmJ5aGpqc2t2Z3hvZHNoaGhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTM4ODgsImV4cCI6MjA5MjYyOTg4OH0.WyWB0pMUrK1tJAYSdKygNrcyaJzcS0dYNsYgPPsj-jU';
const sb=supabase.createClient(SB_URL,SB_KEY);

let currentUser=null,userInfo=null;
let ALL_CLIENTS=[],MIX_CONFIG={},GRUPOS_CONFIG={},EXPANDIDOS_CONFIG={};
let BENCHMARK={},BENCHMARK_TOTAL={};
let selectedClient=null;
let VIEW='ramos'; // 'ramos' | 'cliente'

async function doLogin(){
  const code=document.getElementById('inp-user').value.trim();
  const pass=document.getElementById('inp-pass').value;
  const err=document.getElementById('login-err');
  err.style.display='none';
  if(!code||!pass){err.textContent='Preencha código e senha.';err.style.display='block';return;}
  const btn=document.getElementById('btn-login');
  btn.textContent='Entrando...';btn.disabled=true;
  const emails=[code+'@batalha.app',code+'.0@batalha.app'];
  let data=null,error=null;
  for(const email of emails){
    ({data,error}=await sb.auth.signInWithPassword({email,password:pass}));
    if(!error)break;
  }
  btn.textContent='ENTRAR';btn.disabled=false;
  if(error){err.textContent='Código ou senha incorretos.';err.style.display='block';return;}
  currentUser=data.user;
  await initApp();
}
async function doLogout(){await sb.auth.signOut();location.reload();}

async function initApp(){
  const {data:vu}=await sb.from('Batalha Naval_Vendedor_Usuario').select('*').eq('user_id',currentUser.id).maybeSingle();
  userInfo=vu;
  let supNome='—';
  if(vu){
    const {data:fat}=await sb.from('faturamento').select('supervisor').eq('codrca',vu.codrca).limit(1).maybeSingle();
    if(fat?.supervisor)supNome=fat.supervisor;
  }
  document.getElementById('hdr-id').textContent='RCA: '+(vu?.codrca||'—');
  document.getElementById('hdr-nome').textContent=vu?.nome||'—';
  document.getElementById('hdr-sup').textContent='Supervisor: '+supNome;
  document.getElementById('login-screen').style.display='none';
  const app=document.getElementById('app');
  app.style.display='flex';app.style.flexDirection='column';
  const hoje=new Date();
  const prim=new Date(hoje.getFullYear(),hoje.getMonth(),1);
  document.getElementById('mix-de').value=fmtDate(prim);
  document.getElementById('mix-ate').value=fmtDate(hoje);
  await Promise.all([loadConfig(),loadBenchmark()]);
  await loadData();
}

async function loadConfig(){
  const [mix,grupos,exp]=await Promise.all([
    sb.from('Batalha Naval_Mix Obrigatorio').select('ramo,subcategoria').limit(5000),
    sb.from('Batalha Naval_Grupos').select('ramo,nome_grupo,subcategorias').limit(1000),
    sb.from('Batalha Naval_Produtos_Obrigatorios').select('ramo,subcategoria,descprod').limit(5000)
  ]);
  MIX_CONFIG={};
  (mix.data||[]).forEach(r=>{if(!MIX_CONFIG[r.ramo])MIX_CONFIG[r.ramo]=new Set();MIX_CONFIG[r.ramo].add(r.subcategoria);});
  GRUPOS_CONFIG={};
  (grupos.data||[]).forEach(r=>{if(!GRUPOS_CONFIG[r.ramo])GRUPOS_CONFIG[r.ramo]=[];GRUPOS_CONFIG[r.ramo].push(r);});
  EXPANDIDOS_CONFIG={};
  (exp.data||[]).forEach(r=>{
    if(!EXPANDIDOS_CONFIG[r.ramo])EXPANDIDOS_CONFIG[r.ramo]={};
    if(!EXPANDIDOS_CONFIG[r.ramo][r.subcategoria])EXPANDIDOS_CONFIG[r.ramo][r.subcategoria]=new Set();
    EXPANDIDOS_CONFIG[r.ramo][r.subcategoria].add(r.descprod);
  });
}

async function loadBenchmark(){
  const [bench,total]=await Promise.all([
    sb.from('Batalha Naval_Benchmark_Ramo').select('ramo,subcategoria,total_clientes').limit(10000),
    sb.from('Batalha Naval_Benchmark_Total').select('ramo,total_clientes').limit(1000)
  ]);
  BENCHMARK={};
  (bench.data||[]).forEach(r=>{
    if(!BENCHMARK[r.ramo])BENCHMARK[r.ramo]=[];
    BENCHMARK[r.ramo].push({sub:r.subcategoria,count:parseInt(r.total_clientes)||0});
  });
  Object.keys(BENCHMARK).forEach(ramo=>{
    BENCHMARK[ramo].sort((a,b)=>b.count-a.count);
  });
  BENCHMARK_TOTAL={};
  (total.data||[]).forEach(r=>{BENCHMARK_TOTAL[r.ramo]=parseInt(r.total_clientes)||1;});
}

async function loadData(){
  showLoading(true);
  const de=document.getElementById('mix-de').value;
  const ate=document.getElementById('mix-ate').value;
  const ateD=new Date(ate);ateD.setDate(ateD.getDate()+1);
  const {data,error}=await sb.from('faturamento')
    .select('codcli,cliente,ramo,rca,codrca,subcategoria,descricao,total,supervisor')
    .eq('filial','MAR FOODSERVICE').eq('codoper','S').gt('total',0)
    .gte('dtmov',de).lt('dtmov',fmtDate(ateD)).limit(50000);
  if(error){showLoading(false);return;}
  processData(data||[]);
  populateRamos();
  selectedClient=null;
  VIEW='ramos';
  renderAll();
  showLoading(false);
}
async function reloadData(){selectedClient=null;VIEW='ramos';await loadData();}

function processData(rows){
  const map={};
  rows.forEach(r=>{
    const k=r.codcli;
    if(!map[k])map[k]={codcli:r.codcli,cliente:r.cliente,ramo:r.ramo,rca:r.rca,codrca:r.codrca,supervisor:r.supervisor,subcats:new Set(),produtos:{},fat:0};
    if(r.subcategoria)map[k].subcats.add(r.subcategoria);
    if(r.subcategoria&&r.descricao){
      if(!map[k].produtos[r.subcategoria])map[k].produtos[r.subcategoria]=new Set();
      map[k].produtos[r.subcategoria].add(r.descricao);
    }
    map[k].fat+=(r.total||0);
  });
  ALL_CLIENTS=Object.values(map);
}

function populateRamos(){
  const ramos=[...new Set(ALL_CLIENTS.map(c=>c.ramo).filter(Boolean))].sort();
  const sel=document.getElementById('flt-ramo');
  const cur=sel.value;
  sel.innerHTML='<option value="">Todos os ramos</option>'+ramos.map(r=>`<option value="${r}">${esc(r)}</option>`).join('');
  if(cur)sel.value=cur;
}

function getFilteredClients(){
  const ramo=document.getElementById('flt-ramo').value;
  const busca=document.getElementById('flt-busca').value.toLowerCase();
  const cov=document.getElementById('flt-cob').value;
  return ALL_CLIENTS.filter(c=>{
    if(ramo&&c.ramo!==ramo)return false;
    if(busca&&!c.cliente?.toLowerCase().includes(busca))return false;
    if(cov){
      const pct=getCoverage(c);
      if(pct===null)return false;
      if(cov==='high'&&pct<70)return false;
      if(cov==='mid'&&(pct<40||pct>=70))return false;
      if(cov==='low'&&pct>=40)return false;
    }
    return true;
  }).sort((a,b)=>{const pa=getCoverage(a)??-1,pb=getCoverage(b)??-1;return pa-pb;});
}

function getItens(ramo){
  const itens=[];
  const grupos=GRUPOS_CONFIG[ramo]||[];
  const grupSubs=new Set(grupos.flatMap(g=>g.subcategorias||[]));
  const mixSet=MIX_CONFIG[ramo]||new Set();
  mixSet.forEach(sub=>{
    if(grupSubs.has(sub))return;
    if(EXPANDIDOS_CONFIG[ramo]?.[sub])return;
    itens.push({tipo:'individual',sub});
  });
  grupos.forEach(g=>itens.push({tipo:'grupo',nome:g.nome_grupo,subs:g.subcategorias||[]}));
  if(EXPANDIDOS_CONFIG[ramo]){
    Object.entries(EXPANDIDOS_CONFIG[ramo]).forEach(([sub,prods])=>{
      prods.forEach(prod=>itens.push({tipo:'expandido',sub,prod}));
    });
  }
  return itens;
}

function getCoverage(c){
  const itens=getItens(c.ramo);
  if(!itens.length)return null;
  let ok=0;
  itens.forEach(item=>{
    if(item.tipo==='individual'&&c.subcats.has(item.sub))ok++;
    else if(item.tipo==='grupo'&&item.subs.some(s=>c.subcats.has(s)))ok++;
    else if(item.tipo==='expandido'){const p=c.produtos[item.sub];if(p&&p.has(item.prod))ok++;}
  });
  return Math.round((ok/itens.length)*100);
}

function covColor(pct){if(pct===null)return'var(--text-dim)';return pct>=70?'var(--success)':pct>=40?'var(--gold)':'var(--alert)';}
function covCls(pct){if(pct===null)return'cov-none';return pct>=70?'cov-high':pct>=40?'cov-mid':'cov-low';}
function fillCls(pct){return pct>=70?'fill-high':pct>=40?'fill-mid':'fill-low';}

function renderAll(){
  const clients=getFilteredClients();
  const covs=clients.map(c=>getCoverage(c)).filter(v=>v!==null);
  const baixa=covs.filter(v=>v<40).length;
  const media=covs.filter(v=>v>=40&&v<70).length;
  const alta=covs.filter(v=>v>=70).length;
  const avgSubs=clients.length?(clients.reduce((a,c)=>a+c.subcats.size,0)/clients.length).toFixed(1):0;
  const avgCov=covs.length?Math.round(covs.reduce((a,b)=>a+b,0)/covs.length):0;
  const de=document.getElementById('mix-de').value;
  const ate=document.getElementById('mix-ate').value;
  document.getElementById('st-total').textContent=clients.length;
  document.getElementById('st-baixa').textContent=baixa;
  document.getElementById('st-media').textContent=media;
  document.getElementById('st-alta').textContent=alta;
  document.getElementById('st-subcats').textContent=avgSubs;
  document.getElementById('st-cov').textContent=avgCov+'%';
  document.getElementById('st-periodo').textContent=fmtDateBR(de)+' → '+fmtDateBR(ate);

  renderClientList(clients);

  if(VIEW==='ramos') renderRamos(clients);
  else if(VIEW==='cliente'&&selectedClient) renderDetalhe(selectedClient);
}

function renderClientList(clients){
  const list=document.getElementById('client-list');
  list.innerHTML=`<div class="list-count">${clients.length} clientes</div>`+
    clients.map(c=>{
      const pct=getCoverage(c);
      const isActive=selectedClient?.codcli===c.codcli;
      return`<div class="client-item${isActive?' active':''}" onclick="selectCliente('${c.codcli}')">
        <div class="ci-name">${esc(c.cliente||'—')}</div>
        <div class="ci-fat">${fmtMoney(c.fat)} <span class="ci-ramo">${esc(c.ramo||'')}</span></div>
        <div class="ci-rca">${esc(c.rca||'')}</div>
        ${pct!==null?
          `<div class="cov-bar-wrap"><div class="cov-bar-fill ${fillCls(pct)}" style="width:${pct}%"></div></div>
           <div class="ci-pct ${covCls(pct)}">${pct}%</div>`:
          '<div class="ci-pct cov-none">Sem config</div>'}
      </div>`;
    }).join('');
}

// ===== VIEW: RAMOS =====
function renderRamos(clients){
  const ramoMap={};
  clients.forEach(c=>{
    if(!c.ramo)return;
    if(!ramoMap[c.ramo])ramoMap[c.ramo]=[];
    ramoMap[c.ramo].push(c);
  });
  const ramos=Object.entries(ramoMap).map(([ramo,cls])=>{
    const covs=cls.map(c=>getCoverage(c)).filter(v=>v!==null);
    const avgCov=covs.length?Math.round(covs.reduce((a,b)=>a+b,0)/covs.length):null;
    const avgSubs=cls.length?(cls.reduce((a,c)=>a+c.subcats.size,0)/cls.length).toFixed(1):0;
    const temConfig=!!(MIX_CONFIG[ramo]?.size||GRUPOS_CONFIG[ramo]?.length);
    return{ramo,count:cls.length,avgCov,avgSubs,temConfig};
  }).filter(r=>r.temConfig).sort((a,b)=>(b.avgCov||0)-(a.avgCov||0));

  const semConfig=Object.entries(ramoMap).filter(([r])=>!(MIX_CONFIG[r]?.size||GRUPOS_CONFIG[r]?.length));

  const detail=document.getElementById('detail-panel');
  const ramoFlt=document.getElementById('flt-ramo').value;

  detail.innerHTML=`
    <div class="ramos-header">
      <div class="ramos-title">🎯 COBERTURA DO MIX POR RAMO</div>
      <div class="ramos-sub">RAMOS COM MIX CONFIGURADO (${ramos.length}) — MAIOR COBERTURA PRIMEIRO</div>
    </div>
    <div class="ramos-list">
      ${ramos.map(r=>`
        <div class="ramo-card" onclick="filtrarRamo('${esc(r.ramo)}')">
          <div class="ramo-card-left">
            <div class="ramo-card-nome">${esc(r.ramo)}</div>
            <div class="ramo-card-meta">
              <span>👥 ${r.count} cliente${r.count!==1?'s':''}</span>
              <span>📦 ${r.avgSubs} subcats/cli</span>
            </div>
            <div class="cov-bar-wrap" style="margin-top:6px;max-width:300px">
              <div class="cov-bar-fill ${fillCls(r.avgCov||0)}" style="width:${r.avgCov||0}%"></div>
            </div>
          </div>
          <div class="ramo-card-pct" style="color:${covColor(r.avgCov)}">${r.avgCov!==null?r.avgCov+'%':'—'}</div>
        </div>`).join('')}
      ${semConfig.length?`<div class="sem-config-label">Sem mix configurado: ${semConfig.map(([r])=>r).join(', ')}</div>`:''}
    </div>`;
}

function filtrarRamo(ramo){
  document.getElementById('flt-ramo').value=ramo;
  renderAll();
}

// ===== VIEW: DETALHE CLIENTE =====
function selectCliente(codcli){
  selectedClient=ALL_CLIENTS.find(c=>c.codcli==codcli)||null;
  VIEW='cliente';
  renderAll();
  // Em mobile, scroll para o painel de detalhe
  if(window.innerWidth<768){
    document.getElementById('detail-panel').scrollIntoView({behavior:'smooth'});
  }
}

function voltarRamos(){
  selectedClient=null;
  VIEW='ramos';
  renderAll();
}

function renderDetalhe(c){
  const pct=getCoverage(c);
  const itens=getItens(c.ramo);
  let ok=0;
  itens.forEach(item=>{
    if(item.tipo==='individual'&&c.subcats.has(item.sub))ok++;
    else if(item.tipo==='grupo'&&item.subs.some(s=>c.subcats.has(s)))ok++;
    else if(item.tipo==='expandido'){const p=c.produtos[item.sub];if(p&&p.has(item.prod))ok++;}
  });
  const falta=itens.length-ok;

  // Col 1: Mix obrigatorio
  const mixHtml=itens.length?itens.map(item=>{
    let comprou=false,label='',tag='';
    if(item.tipo==='individual'){comprou=c.subcats.has(item.sub);label=item.sub;}
    else if(item.tipo==='grupo'){comprou=item.subs.some(s=>c.subcats.has(s));label=item.nome;tag='<span class="tag-g">Grupo</span>';}
    else{const p=c.produtos[item.sub];comprou=p&&p.has(item.prod);label=item.prod;tag='<span class="tag-p">Produto</span>';}
    return`<div class="mix-row ${comprou?'ok':'nok'}">
      <span class="mix-ico">${comprou?'✅':'🔴'}</span>
      <span class="mix-lbl">${esc(label)}</span>${tag}
    </div>`;
  }).join(''):'<div class="empty-sm">Sem mix configurado.</div>';

  // Col 2: Benchmark global do ramo
  const benchItems=BENCHMARK[c.ramo]||[];
  const benchTotal=BENCHMARK_TOTAL[c.ramo]||1;
  const mixObrigSet=MIX_CONFIG[c.ramo]||new Set();
  const benchTop20=benchItems.slice(0,20);
  const benchHtml=benchTop20.length?benchTop20.map((item,i)=>{
    const isObrig=mixObrigSet.has(item.sub);
    const pctVal=Math.round((item.count/benchTotal)*100);
    return`<div class="bench-row">
      <span class="bench-pos">${i+1}.</span>
      <span class="bench-sub${isObrig?' obrig':''}">${esc(item.sub)}${isObrig?' <span class="dot">●</span>':''}</span>
      <span class="bench-count">${item.count} cli</span>
      <span class="bench-pct">${pctVal}%</span>
    </div>`;
  }).join(''):'<div class="empty-sm">Sem dados globais.</div>';

  // Col 3: Itens comprados pelo cliente
  const subcats=[...c.subcats].sort();
  const compradasHtml=subcats.map(sub=>{
    const isObrig=mixObrigSet.has(sub);
    return`<div class="comprada-row">
      <span class="comprada-sub${isObrig?' obrig':''}">${esc(sub)}${isObrig?' <span class="dot">●</span>':''}</span>
      <span class="comprada-cnt">${c.produtos[sub]?.size||0}p</span>
    </div>`;
  }).join('');

  document.getElementById('detail-panel').innerHTML=`
    <div class="dh-wrap">
      <button class="btn-voltar" onclick="voltarRamos()">← Voltar ao resumo</button>
      <div class="dh-nome">${esc(c.cliente||'—')}</div>
      <div class="dh-meta">
        <span class="tag-ramo">${esc(c.ramo||'—')}</span>
        <span>RCA: <strong>${esc(c.rca||'—')}</strong></span>
        <span>Supervisor: <strong>${esc(c.supervisor||'—')}</strong></span>
        <span class="c-success"><strong>${fmtMoney(c.fat)}</strong></span>
      </div>
      <div class="dh-cards">
        <div class="dh-card"><div class="dh-cv">${itens.length}</div><div class="dh-cl">Itens Obrig.</div></div>
        <div class="dh-card c-ok"><div class="dh-cv">${ok}</div><div class="dh-cl">Comprou ✅</div></div>
        <div class="dh-card c-nok"><div class="dh-cv">${falta}</div><div class="dh-cl">Faltam 🔴</div></div>
        <div class="dh-card" style="color:${covColor(pct)}"><div class="dh-cv">${pct!==null?pct+'%':'—'}</div><div class="dh-cl">Cobertura</div></div>
        <div class="dh-card"><div class="dh-cv">${benchItems.length}</div><div class="dh-cl">+ Vendidos</div></div>
        <div class="dh-card c-foam"><div class="dh-cv">${subcats.length}</div><div class="dh-cl">Subcats Compradas</div></div>
      </div>
    </div>
    <div class="detail-cols">
      <div class="detail-col">
        <div class="col-title">🎯 MIX OBRIGATÓRIO — ${ok}/${itens.length} ITENS</div>
        ${mixHtml}
      </div>
      <div class="detail-col">
        <div class="col-title">🏆 MIX + VENDIDO NA SUBCATEGORIA — ${benchItems.length}/${Math.min(20,benchItems.length)} • = OBRIG.</div>
        ${benchHtml}
      </div>
      <div class="detail-col">
        <div class="col-title">🛒 TODOS OS ITENS COMPRADOS — ${subcats.length} SUBCATS • = OBRIG. • P = PRODUTOS</div>
        ${compradasHtml}
      </div>
    </div>`;
}

function showLoading(v){
  if(v){
    document.getElementById('client-list').innerHTML='<div class="loading"><div class="spinner"></div><span>Carregando...</span></div>';
    document.getElementById('detail-panel').innerHTML='';
  }
}

function fmtDate(d){return d.toISOString().split('T')[0];}
function fmtDateBR(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function fmtMoney(v){return'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session){currentUser=session.user;await initApp();}
})();

</script>
