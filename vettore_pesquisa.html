<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisa Vettore — Assessment</title>
<style>
  :root{
    --mar-azul:#0B5C9E; --mar-azul-esc:#083E6B; --mar-vermelho:#B01E28;
    --bg:#EEF2F6; --card:#FFFFFF; --texto:#1F2A37; --suave:#6B7280;
    --borda:#E2E8F0; --ok:#16A34A; --sombra:0 2px 10px rgba(15,40,70,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--texto);line-height:1.45}
  .topo{background:linear-gradient(135deg,var(--mar-azul),var(--mar-azul-esc));color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .topo .marca{font-weight:800;letter-spacing:1px;font-size:13px;opacity:.85}
  .topo h1{font-size:19px;margin-top:2px}
  .topo .ref{font-size:12px;opacity:.8;margin-top:4px;font-style:italic}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sombra)}
  .card h2{font-size:15px;color:var(--mar-azul-esc);margin-bottom:12px}
  label.f{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--texto)}
  input.f{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:9px;font-size:15px;margin-bottom:12px}
  input.f:focus{outline:none;border-color:var(--mar-azul)}
  .bloco-tit{font-size:13px;font-weight:800;color:var(--mar-azul);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--borda)}
  .perg{padding:12px 0;border-bottom:1px dashed var(--borda)}
  .perg:last-child{border-bottom:none}
  .perg-txt{font-size:14px;margin-bottom:10px}
  .perg-ref{font-size:11px;color:var(--suave);font-style:italic;display:block;margin-top:3px}
  .escala{display:flex;gap:7px;flex-wrap:wrap}
  .eb{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--borda);background:#fff;font-size:15px;font-weight:700;color:var(--suave);cursor:pointer;transition:all .12s}
  .eb:hover{border-color:var(--mar-azul)}
  .eb.sel{background:var(--mar-azul);color:#fff;border-color:var(--mar-azul);transform:scale(1.05)}
  .legenda{font-size:11px;color:var(--suave);margin-top:8px}
  .barra{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--borda);padding:12px 16px;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
  .barra .prog{height:7px;background:var(--borda);border-radius:99px;overflow:hidden;margin-bottom:9px}
  .barra .prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
  .btn-primario{background:var(--mar-azul);color:#fff}
  .btn-primario:disabled{background:#B8C4D0;cursor:not-allowed}
  .btn-wpp{background:#25D366;color:#fff;margin-bottom:10px}
  .btn-sec{background:#fff;color:var(--mar-azul);border:1.5px solid var(--mar-azul)}
  .status{font-size:12px;text-align:center;color:var(--suave);margin-bottom:8px}
  .selector{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .selp{border:1.5px solid var(--borda);border-radius:11px;padding:14px;cursor:pointer;background:#fff;text-align:left}
  .selp:hover{border-color:var(--mar-azul);box-shadow:var(--sombra)}
  .selp .ic{font-size:22px}
  .selp .nm{font-weight:700;font-size:14px;margin-top:4px}
  .selp .sb{font-size:11px;color:var(--suave)}
  .fim{text-align:center;padding:10px 0}
  .fim .check{font-size:48px}
  .codebox{background:#F1F5F9;border:1px dashed var(--borda);border-radius:9px;padding:12px;font-family:monospace;font-size:11px;word-break:break-all;margin:12px 0;max-height:120px;overflow:auto}
  .aviso{font-size:12px;color:var(--suave);text-align:center;margin-top:10px}
  @media(max-width:480px){.selector{grid-template-columns:1fr}}
</style>
</head>
<body>

  cliente: {

    ref: "Baseado em NPS (Bain & Company) + CSAT (Qualtrics) + CES — Perspectiva de fora para dentro",
    blocos: [
      { titulo: "A — Comunicacao Recebida", perguntas: [
        { id:"cl1", texto:"A MAR te comunica de forma proativa sobre novidades, promocoes e oportunidades — ou voce so e contactado quando a MAR quer vender algo?", ref:"CSAT Best Practices — Proactive vs reactive" },
        { id:"cl2", texto:"A comunicacao que voce recebe da MAR e relevante para o seu negocio — ou e generica e nao considera o seu perfil de cliente?", ref:"NPS driver — Personalization" },

      ]},
      { titulo: "B — Experiencia de Relacionamento", perguntas: [
        { id:"cl4", texto:"Quando voce tem um problema — entrega errada, produto faltante, erro de pedido — a MAR resolve de forma rapida e sem burocracia?", ref:"CES — Problem resolution effort" },
        { id:"cl5", texto:"O representante da MAR que te visita chega preparado — sabe o que voce compra, o que falta, o que pode melhorar no seu cardapio?", ref:"Sales Comm. Maturity — RCA preparation" },
        { id:"cl6", texto:"A MAR entrega o que promete — produto certo, prazo certo, quantidade certa — de forma consistente?", ref:"CSAT — Delivery reliability" },

      { titulo: "C — Valor e Lealdade", perguntas: [
        { id:"cl7", texto:"A MAR te ajuda a ter mais sucesso no seu negocio — nao apenas te vende produto, mas te apoia com informacao e solucao?", ref:"NPS driver — Business value" },

  },

  fornecedor: {
    titulo: "Fornecedor",
    ref: "Baseado em Voice of Supplier (UNA.com) + Supplier Satisfaction Framework — Perspectiva de fora para dentro",
    blocos: [
      { titulo: "A — Comunicacao da MAR com Voce", perguntas: [
        { id:"fn1", texto:"A MAR te avisa com antecedencia quando precisa aumentar, reduzir ou pausar pedidos — ou voce descobre de surpresa?", ref:"Voice of Supplier — Forecast communication" },
        { id:"fn2", texto:"Existe um canal oficial e claro para voce se comunicar com a MAR — ou voce depende de encontrar a pessoa certa?", ref:"Voice of Supplier — Channel governance" },
        { id:"fn3", texto:"A MAR define e cumpre um prazo claro para confirmar datas de entrega depois que voce envia o produto?", ref:"Voice of Supplier — SLA clarity" },
      ]},
      { titulo: "B — Reconhecimento e Parceria", perguntas: [
        { id:"fn4", texto:"Voce sabe onde o produto que entrega para a MAR vai chegar — qual restaurante, qual regiao, qual segmento de cliente?", ref:"Voice of Supplier — Destination transparency" },
        { id:"fn5", texto:"A MAR reconhece e valoriza o seu trabalho publicamente — ou sua contribuicao e invisivel para o mercado?", ref:"Voice of Supplier — Recognition" },

      ]},
      { titulo: "C — Resultado e Continuidade", perguntas: [
        { id:"fn7", texto:"A sua relacao com a MAR e baseada em parceria e confianca — ou e puramente transacional (preco e prazo)?", ref:"Voice of Supplier — Partnership depth" },
        { id:"fn8", texto:"Em uma escala de 0 a 5, o quanto voce recomendaria a MAR como parceiro comercial para outro produtor ou fabricante?", ref:"NPS adapted — Supplier advocacy" },

function getParam(k){return new URLSearchParams(location.search).get(k);}
var perfilId = getParam('perfil');
var respostas = {};
var identidade = {nome:'', setor:''};

var app = document.getElementById('app');

function perfilInfo(id){ return ASS_PERFIS.find(function(p){return p.id===id;}); }
function precisaSetor(id){ var p=perfilInfo(id); return p && (p.n>1 || p.externo); }

function tela(html){ app.innerHTML = html; }

// ---------- SELETOR (quando nao ha ?perfil= no link) ----------
function renderSeletor(){
  var cards = ASS_PERFIS.filter(function(p){return ASS_QUESTIONARIOS[p.id];}).map(function(p){
    return '<div class="selp" onclick="location.search=\'?perfil='+p.id+'\'">'+
      '<div class="ic">'+p.icon+'</div><div class="nm">'+p.label+'</div>'+
      '<div class="sb">'+p.sub+' · '+(ASS_QUESTIONARIOS[p.id].blocos.reduce(function(a,b){return a+b.perguntas.length;},0))+' perguntas</div></div>';
  }).join('');
  tela('<div class="topo"><div class="marca">VETTORE · MAR FOOD SERVICE</div><h1>Pesquisa de Diagnóstico</h1>'+
    '<div class="ref">Modo teste — escolha um perfil para simular o envio</div></div>'+
    '<div class="wrap"><div class="card"><h2>Selecione o perfil / área</h2><div class="selector">'+cards+'</div></div>'+
    '<p class="aviso">Na versão real, cada pessoa recebe um link já com o perfil dela (ex.: ?perfil=rca) e vê só estas perguntas.</p></div>');
}

// ---------- FORMULARIO ----------
function renderForm(){
  var q = ASS_QUESTIONARIOS[perfilId];
  var p = perfilInfo(perfilId);
  if(!q){ tela('<div class="wrap"><div class="card">Perfil não encontrado: '+perfilId+'</div></div>'); return; }

  var idBlock = '';
  if(precisaSetor(perfilId)){
    idBlock = '<div class="card"><h2>Identificação</h2>'+
      '<label class="f">Seu nome</label><input class="f" id="in-nome" placeholder="Nome completo" oninput="identidade.nome=this.value">'+
      '<label class="f">Setor / Região</label><input class="f" id="in-setor" placeholder="Ex.: Interior · Metropolitana · Kuhn" oninput="identidade.setor=this.value"></div>';
  } else {
    idBlock = '<div class="card"><h2>Identificação</h2>'+
      '<label class="f">Seu nome <span style="font-weight:400;color:var(--suave)">(opcional)</span></label>'+
      '<input class="f" id="in-nome" placeholder="'+(p.sub||'')+'" oninput="identidade.nome=this.value"></div>';
  }

  var blocos = q.blocos.map(function(b){
    var pergs = b.perguntas.map(function(pg){
      var btns = [0,1,2,3,4,5].map(function(v){
        return '<button class="eb" id="b-'+pg.id+'-'+v+'" onclick="marcar(\''+pg.id+'\','+v+')">'+v+'</button>';
      }).join('');
      var ref = pg.ref ? '<span class="perg-ref">Ref.: '+pg.ref+'</span>' : '';
      return '<div class="perg"><div class="perg-txt">'+pg.texto+ref+'</div><div class="escala">'+btns+'</div></div>';
    }).join('');
    return '<div class="card"><div class="bloco-tit">'+b.titulo+'</div>'+pergs+'</div>';
  }).join('');

  var total = q.blocos.reduce(function(a,b){return a+b.perguntas.length;},0);

  tela('<div class="topo"><div class="marca">VETTORE · MAR FOOD SERVICE</div><h1>'+p.icon+' '+q.titulo+'</h1>'+
    '<div class="ref">'+(q.ref||'')+'</div></div>'+
    '<div class="wrap">'+idBlock+
    '<div class="card"><h2>Como responder</h2><p style="font-size:13px;color:var(--suave)">'+
    'Avalie de <b>0</b> (discordo totalmente / não existe) a <b>5</b> (concordo totalmente / plenamente estabelecido). '+
    'Se não souber avaliar, deixe em branco.</p></div>'+
    blocos+
    '</div>'+
    '<div class="barra"><div class="prog"><i id="prog-i"></i></div>'+
    '<div class="status" id="status">0 de '+total+' respondidas</div>'+
    '<button class="btn btn-primario" id="btn-fim" onclick="finalizar()">Finalizar e gerar código</button></div>');
  atualizarProgresso();
}

function marcar(id,v){
  respostas[id]=v;
  var q=ASS_QUESTIONARIOS[perfilId];
  q.blocos.forEach(function(b){b.perguntas.forEach(function(pg){
    if(pg.id===id){for(var k=0;k<=5;k++){var el=document.getElementById('b-'+id+'-'+k); if(el) el.classList.toggle('sel',k===v);}}
  });});
  atualizarProgresso();
}

function totalPerguntas(){ return ASS_QUESTIONARIOS[perfilId].blocos.reduce(function(a,b){return a+b.perguntas.length;},0); }

function atualizarProgresso(){
  var total=totalPerguntas(); var resp=Object.keys(respostas).length;
  var pct=Math.round(resp/total*100);
  var i=document.getElementById('prog-i'); if(i) i.style.width=pct+'%';
  var s=document.getElementById('status'); if(s) s.textContent=resp+' de '+total+' respondidas ('+pct+'%)';
}

function finalizar(){
  var total=totalPerguntas(); var resp=Object.keys(respostas).length;
  if(resp < Math.ceil(total*0.5)){ alert('Responda ao menos metade das perguntas ('+Math.ceil(total*0.5)+' de '+total+') antes de finalizar.'); return; }
  if(precisaSetor(perfilId) && (!identidade.nome.trim()||!identidade.setor.trim())){ alert('Preencha seu nome e setor/região.'); return; }

  var payload={p:perfilId, n:identidade.nome.trim(), s:identidade.setor.trim(), a:respostas, t:Date.now()};
  var code='MARV1:'+btoa(unescape(encodeURIComponent(JSON.stringify(payload))));

  var soma=Object.values(respostas).reduce(function(a,b){return a+b;},0);
  var score=Math.round(soma/(resp*5)*100);
  var q=ASS_QUESTIONARIOS[perfilId]; var p=perfilInfo(perfilId);

  var msg='Assessment Vettore - '+q.titulo+(identidade.nome?(' - '+identidade.nome):'')+'%0A'+
          'Respondidas: '+resp+'/'+total+'%0A%0ACODIGO (copie tudo abaixo):%0A'+encodeURIComponent(code);

  tela('<div class="topo"><div class="marca">VETTORE · MAR FOOD SERVICE</div><h1>Pronto!</h1></div>'+
    '<div class="wrap"><div class="card fim"><div class="check">✅</div>'+
    '<h2 style="margin-top:8px">Respostas registradas</h2>'+
    '<p style="font-size:13px;color:var(--suave);margin-top:6px">'+q.titulo+' · '+resp+' de '+total+' respondidas</p></div>'+
    '<div class="card"><h2>Enviar suas respostas</h2>'+
    '<p style="font-size:13px;color:var(--suave);margin-bottom:12px">Toque no botão abaixo para enviar pelo WhatsApp, ou copie o código e cole onde combinaram.</p>'+
    '<a class="btn btn-wpp" href="https://wa.me/?text='+msg+'" target="_blank">📲 Enviar no WhatsApp</a>'+
    '<button class="btn btn-sec" onclick="copiar(\''+code+'\')">📋 Copiar código</button>'+
    '<div class="codebox" id="cb">'+code+'</div></div>'+
    '<p class="aviso">Este é o código que você envia. Quem coordena a pesquisa vai lançá-lo no painel geral.</p></div>');
}

function copiar(code){
  navigator.clipboard.writeText(code).then(function(){alert('Código copiado!');},
    function(){var r=document.createRange();r.selectNode(document.getElementById('cb'));window.getSelection().removeAllRanges();window.getSelection().addRange(r);document.execCommand('copy');alert('Código copiado!');});
}

// INIT
if(perfilId && ASS_QUESTIONARIOS[perfilId]){ renderForm(); } else { renderSeletor(); }
</script>
</body>
</html>
